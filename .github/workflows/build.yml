name: Build Android APK

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: "21"

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Next.js Build and Export
      run: npm run build

    - name: Add Android Platform
      run: |
        rm -rf android
        npx cap add android

    - name: Copy Custom AndroidManifest
      run: cp .github/manifests/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

    - name: Install ImageMagick
      run: sudo apt-get update && sudo apt-get install -y imagemagick

    - name: Set App Icon
      run: bash .github/scripts/set-app-icon.sh android assets/icon.png

    - name: Remove native splash (blue X)
      run: bash .github/scripts/remove-splash.sh android

    - name: Copy Native Java Files
      run: |
        TARGET=android/app/src/main/java/com/neurasamu/build/chat
        mkdir -p $TARGET
        cp .github/native/MainActivity.java $TARGET/
        cp .github/native/SmsPlugin.java $TARGET/
        cp .github/native/TelecomPlugin.java $TARGET/
        cp .github/native/CallService.java $TARGET/
        cp .github/native/CallActivity.java $TARGET/
        cp .github/native/PendingCallLogStore.java $TARGET/
        cp .github/native/CallIntentProcessor.java $TARGET/
        cp .github/native/SmsReceiver.java $TARGET/
        cp .github/native/MmsReceiver.java $TARGET/
        cp .github/native/HeadlessSmsSendService.java $TARGET/
        cp .github/native/BootReceiver.java $TARGET/
        cp .github/native/SettingsPlugin.java $TARGET/
        cp .github/native/AiWebViewPlugin.java $TARGET/
        cp .github/native/AiWebViewActivity.java $TARGET/
        cp .github/native/BlockedStore.java $TARGET/
        cp .github/native/SnoozeStore.java $TARGET/
        cp .github/native/NeuraContactsPlugin.java $TARGET/
        cp .github/native/NameResolver.java $TARGET/
        cp .github/native/SmsNotifier.java $TARGET/
        cp .github/native/SmsReplyReceiver.java $TARGET/
        cp .github/native/CallNotifier.java $TARGET/
        mkdir -p android/app/src/main/res/drawable
        mkdir -p android/app/src/main/res/layout
        mkdir -p android/app/src/main/res/values
        cp .github/native/res/drawable/ic_stat_sms.xml android/app/src/main/res/drawable/
        cp .github/native/res/drawable/ic_stat_call.xml android/app/src/main/res/drawable/
        cp .github/native/res/drawable/ic_call_*.xml android/app/src/main/res/drawable/
        cp .github/native/res/drawable/bg_overlay_*.xml android/app/src/main/res/drawable/
        cp .github/native/res/drawable/bg_call_*.xml android/app/src/main/res/drawable/
        cp .github/native/res/drawable/bg_numpad_key.xml android/app/src/main/res/drawable/
        cp .github/native/res/layout/overlay_incoming_call.xml android/app/src/main/res/layout/
        cp .github/native/res/layout/activity_call.xml android/app/src/main/res/layout/
        cp .github/native/res/values/overlay_styles.xml android/app/src/main/res/values/
        cp .github/native/IncomingCallOverlay.java $TARGET/

    - name: Sync Android
      run: npx cap sync android

    - name: Build Android App
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NeuraChat-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
