name: Build Android APK

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: "21"

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Next.js Build and Export
      run: npm run build

    - name: Add Android Platform
      run: |
        rm -rf android
        npx cap add android

    - name: Copy Custom AndroidManifest
      run: cp .github/manifests/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

    - name: Install ImageMagick
      run: sudo apt-get update && sudo apt-get install -y imagemagick

    - name: Set App Icon
      run: bash .github/scripts/set-app-icon.sh android assets/icon.png

    - name: Remove native splash (blue X)
      run: bash .github/scripts/remove-splash.sh android

    - name: Copy Native Java Files
      run: |
        TARGET=android/app/src/main/java/com/neurasamu/build/chat
        mkdir -p $TARGET
        cp .github/native/MainActivity.java $TARGET/
        cp .github/native/SmsPlugin.java $TARGET/
        cp .github/native/SoundPreferenceStore.java $TARGET/
        cp .github/native/SoundPlugin.java $TARGET/
        cp .github/native/SmsReceiver.java $TARGET/
        cp .github/native/MmsReceiver.java $TARGET/
        cp .github/native/HeadlessSmsSendService.java $TARGET/
        cp .github/native/BootReceiver.java $TARGET/
        cp .github/native/SettingsPlugin.java $TARGET/
        cp .github/native/BlockedStore.java $TARGET/
        cp .github/native/SnoozeStore.java $TARGET/
        cp .github/native/NeuraContactsPlugin.java $TARGET/
        cp .github/native/NameResolver.java $TARGET/
        cp .github/native/SmsNotifier.java $TARGET/
        cp .github/native/SmsReplyReceiver.java $TARGET/
        cp .github/native/VipContactStore.java $TARGET/
        cp .github/native/VipAlarmActivity.java $TARGET/
        cp .github/native/VipAlarmNotifier.java $TARGET/
        mkdir -p android/app/src/main/res/drawable
        mkdir -p android/app/src/main/res/layout
        mkdir -p android/app/src/main/res/values
        cp .github/native/res/drawable/ic_stat_sms.xml android/app/src/main/res/drawable/
        cp .github/native/res/drawable/ic_stat_call.xml android/app/src/main/res/drawable/
        cp .github/native/res/drawable/ic_call_*.xml android/app/src/main/res/drawable/
        cp .github/native/res/drawable/bg_overlay_*.xml android/app/src/main/res/drawable/
        cp .github/native/res/drawable/bg_call_*.xml android/app/src/main/res/drawable/
        cp .github/native/res/drawable/bg_numpad_key.xml android/app/src/main/res/drawable/
        cp .github/native/res/drawable/bg_vip_alarm_dismiss.xml android/app/src/main/res/drawable/
        cp .github/native/res/layout/overlay_incoming_call.xml android/app/src/main/res/layout/
        cp .github/native/res/layout/activity_call.xml android/app/src/main/res/layout/
        cp .github/native/res/layout/activity_vip_alarm.xml android/app/src/main/res/layout/
        cp .github/native/res/values/overlay_styles.xml android/app/src/main/res/values/

    - name: Sync Android
      run: npx cap sync android

    - name: Pin AGP to stable version
      run: |
        # AGP 8.13.0 was just released and its transitive deps are not yet
        # fully available in the Maven repos. Pin to a well-tested version.
        sed -i 's|com.android.tools.build:gradle:8.[0-9]*.[0-9]*|com.android.tools.build:gradle:8.9.1|g' android/build.gradle
        echo "=== android/build.gradle (after pin) ==="
        cat android/build.gradle

    - name: Setup Release Signing
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/neurachat-release.jks
        echo "Keystore decoded: $(stat -c%s android/app/neurachat-release.jks) bytes"

        python3 - << 'PYEOF'
        path = 'android/app/build.gradle'
        with open(path) as f:
            g = f.read()

        # 1) Insert signingConfigs right after `android {`
        signing = '''
            signingConfigs {
                release {
                    storeFile file('neurachat-release.jks')
                    storePassword System.getenv("KEYSTORE_PASSWORD")
                    keyAlias System.getenv("KEY_ALIAS")
                    keyPassword System.getenv("KEY_PASSWORD")
                }
            }
        '''
        marker = 'android {'
        idx = g.find(marker)
        assert idx != -1, 'android { not found'
        insert_at = idx + len(marker)
        g = g[:insert_at] + signing + g[insert_at:]

        # 2) Wire signingConfig into existing release block
        old_release = '''        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }'''
        new_release = '''        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }'''
        assert g.count(old_release) == 1, f'release block count: {g.count(old_release)}'
        g = g.replace(old_release, new_release, 1)

        with open(path, 'w') as f:
            f.write(g)
        print('build.gradle signing injected')
        PYEOF

    - name: Build Release AAB (Play Store)
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew bundleRelease

    - name: Build Release APK (sideload)
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd android
        ./gradlew assembleRelease

    - name: Upload Release AAB (Play Store)
      uses: actions/upload-artifact@v4
      with:
        name: NeuraChat-Release-AAB
        path: android/app/build/outputs/bundle/release/app-release.aab
        retention-days: 90

    - name: Upload Release APK (Sideload)
      uses: actions/upload-artifact@v4
      with:
        name: NeuraChat-Release-APK
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 90

